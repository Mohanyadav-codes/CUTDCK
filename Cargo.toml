[workspace]
resolver = "3"
members = ["src-tauri", "crates/engine", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mohan Yadav"]
license = "LicenseRef-Proprietary"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
